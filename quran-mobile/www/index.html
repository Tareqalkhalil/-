<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1d2a24;--mu:#6b7a72;--ac:#1f6f50;--bd:#e3dccb;--hl:#fff3c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101914;--card:#18241d;--tx:#e8efe9;--mu:#93a39a;--ac:#5fc79b;--bd:#2a3a31;--hl:#3a3516}}
:root[data-theme="dark"]{--bg:#101914;--card:#18241d;--tx:#e8efe9;--mu:#93a39a;--ac:#5fc79b;--bd:#2a3a31;--hl:#3a3516}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Amiri',serif;font-size:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
h1{margin:0;padding:10px 14px 4px;font-size:22px;color:var(--ac)}
nav{display:flex;gap:4px;padding:4px 10px 8px;overflow-x:auto}
nav button,.btn{font:inherit;font-size:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.s{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.s b{color:var(--ac);min-width:26px}.s small{color:var(--mu);display:block;font-size:13px}
.q{font-family:'Amiri Quran','Amiri',serif;line-height:2.4;text-align:justify;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.a{cursor:pointer;border-radius:6px}.a.hl{background:var(--hl)}.a.bm{border-bottom:2px solid var(--ac)}
.n{color:var(--ac);font-size:.7em;margin:0 4px}
.bis{text-align:center;font-family:'Amiri Quran',serif;font-size:1.2em;margin-bottom:8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,textarea{font:inherit;font-size:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%}
.r{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.r small{color:var(--mu)}.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
progress{width:100%;height:14px;accent-color:var(--ac)}.mu{color:var(--mu);font-size:15px}
</style>
</head>
<body>
<header><h1>📖 قارئ القرآن الكريم</h1>
<nav id="nav"></nav></header>
<main id="m"></main>
<script>
const NAMES="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const mem={};
const ls={get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}},
set(k,v){mem[k]=v;try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const norm=t=>t.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let D=[],BY={},tab='home',cur=null,fs=Number(ls.get('q_fs'))||26,hlA=null;
let BM=[];try{BM=JSON.parse(ls.get('q_bm')||'[]')}catch(e){}
let W={goal:20,date:'',count:0};try{W=Object.assign(W,JSON.parse(ls.get('q_wird')||'{}'))}catch(e){}
const today=()=>new Date().toISOString().slice(0,10);
if(W.date!==today()){W.date=today();W.count=0}
function parse(raw){const out=[];for(const ln of raw.split(/\r?\n/)){if(!ln||ln[0]==='#')continue;const p=ln.split('|');if(p.length<3)continue;const s=+p[0],a=+p[1];if(!s||!a)continue;out.push({s,a,t:p.slice(2).join('|').trim(),n:null})}return out}
function load(raw){const d=parse(raw);if(d.length<6000)return false;D=d;BY={};d.forEach(v=>{(BY[v.s]=BY[v.s]||[]).push(v)});return true}
function bis(){return BY[1]&&BY[1][0]?BY[1][0].t:''}
const saveBM=()=>ls.set('q_bm',JSON.stringify(BM));
const saveW=()=>ls.set('q_wird',JSON.stringify(W));
function nav(){const t=[['home','السور'],['search','بحث'],['bm','العلامات'],['wird','الورد اليومي'],['set','الإعدادات']];
const el=document.getElementById('nav');el.innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('');
el.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;render()})}
function render(){nav();const m=document.getElementById('m');
if(!D.length&&tab!=='set'){m.innerHTML=importBox(true);bindImport();return}
if(cur){reader(m);return}
({home,search,bm,wird,set})[tab](m);window.scrollTo(0,0)}
function importBox(first){return `<div class="box"><h3 style="margin-top:0">${first?'مرحباً! لنبدأ بإضافة نص القرآن':'استيراد النص'}</h3>
<p>للحفاظ على دقة النص لا يتضمن التطبيق نصاً مكتوباً يدوياً، بل يستورد النص المعتمد من <b>Tanzil.net</b>:</p>
<ol class="mu"><li>افتح tanzil.net/download واختر Text (with aya numbers) بصيغة <b>Pipe-separated</b></li>
<li>اختر النص العثماني (Uthmani) ونزّل الملف</li><li>اختر الملف هنا:</li></ol>
<input type="file" id="f" accept=".txt,text/plain"><p class="mu">أو الصق النص في الخانة التالية:</p>
<textarea id="p" rows="4" placeholder="1|1|..."></textarea><p><button class="btn pri" id="go">استيراد</button> <span id="msg" class="mu"></span></p>
<p class="mu">يشترط ترخيص Tanzil عدم تعديل النص وذكر المصدر.</p></div>`}
function bindImport(){const msg=document.getElementById('msg');
const doit=raw=>{if(load(raw)){const ok=ls.set('q_raw',raw);msg.textContent=ok?'تم الاستيراد ✓':'تم، لكن لم يُحفظ بعد إغلاق الصفحة (المساحة غير كافية)';tab='home';setTimeout(render,600)}else msg.textContent='الملف غير صالح. تأكد من الصيغة سورة|آية|نص'};
document.getElementById('f').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(doit)};
document.getElementById('go').onclick=()=>{const v=document.getElementById('p').value;if(v)doit(v)}}
function home(m){const last=ls.get('q_last');let h='';
if(last){const[s,a]=last.split(':').map(Number);h+=`<div class="box">آخر موضع قراءة: <b>سورة ${NAMES[s-1]}</b>، آية ${ar(a)} <button class="btn pri" id="res">متابعة</button></div>`}
h+='<div class="grid">'+NAMES.map((n,i)=>`<div class="s" data-s="${i+1}"><b>${ar(i+1)}</b><div>${n}<small>${ar((BY[i+1]||[]).length)} آية</small></div></div>`).join('')+'</div>';
m.innerHTML=h;m.querySelectorAll('.s').forEach(e=>e.onclick=()=>open(+e.dataset.s));
const r=document.getElementById('res');if(r)r.onclick=()=>{const[s,a]=last.split(':').map(Number);open(s,a)}}
function open(s,a){cur=s;hlA=a||null;render()}
function reader(m){const s=cur,v=BY[s]||[];
let h=`<div class="bar"><button class="btn" id="bk">→ السور</button><b style="flex:1">سورة ${NAMES[s-1]}</b>
<button class="btn" id="mn">أ-</button><button class="btn" id="pl">أ+</button>
<button class="btn" id="pv" ${s<=1?'disabled':''}>السابقة</button><button class="btn" id="nx" ${s>=114?'disabled':''}>التالية</button></div><div class="q" style="font-size:${fs}px">`;
if(s!==1&&s!==9)h+=`<div class="bis">${esc(bis())}</div>`;
h+=v.map(x=>{const k=x.s+':'+x.a;return `<span class="a ${BM.includes(k)?'bm':''} ${hlA===x.a?'hl':''}" id="a${x.a}" data-a="${x.a}">${esc(x.t)}<span class="n">﴿${ar(x.a)}﴾</span></span> `}).join('')+'</div>';
h+=`<p class="mu">اضغط على آية لحفظ موضع القراءة، واضغط مطولاً أو اضغط مرتين لوضع علامة.</p><button class="btn pri" id="done">✓ أتممت قراءة السورة (إضافة للورد)</button>`;
m.innerHTML=h;
const q=id=>document.getElementById(id);
q('bk').onclick=()=>{cur=null;render()};
q('mn').onclick=()=>{fs=Math.max(18,fs-2);ls.set('q_fs',fs);reader(m)};
q('pl').onclick=()=>{fs=Math.min(48,fs+2);ls.set('q_fs',fs);reader(m)};
q('pv').onclick=()=>open(s-1);q('nx').onclick=()=>open(s+1);
q('done').onclick=()=>{W.count+=v.length;saveW();q('done').textContent='تمت الإضافة ✓ ('+ar(W.count)+' آية اليوم)'};
m.querySelectorAll('.a').forEach(e=>{const a=+e.dataset.a,k=s+':'+a;
e.onclick=()=>{ls.set('q_last',k);m.querySelectorAll('.a.hl').forEach(x=>x.classList.remove('hl'));e.classList.add('hl')};
e.ondblclick=()=>{const i=BM.indexOf(k);i>=0?BM.splice(i,1):BM.push(k);saveBM();e.classList.toggle('bm')}});
if(hlA){const t=document.getElementById('a'+hlA);if(t)t.scrollIntoView({block:'center'})}else window.scrollTo(0,0)}
function search(m){m.innerHTML=`<input id="qs" placeholder="ابحث بكلمة (بدون تشكيل)..." autofocus><p class="mu" id="cnt"></p><div id="res"></div>`;
const inp=document.getElementById('qs');
if(!D[0].n)D.forEach(x=>x.n=norm(x.t));
inp.oninput=()=>{const k=norm(inp.value.trim());const R=document.getElementById('res'),C=document.getElementById('cnt');
if(k.length<2){R.innerHTML='';C.textContent='';return}
const f=D.filter(x=>x.n.includes(k));C.textContent=ar(f.length)+' نتيجة'+(f.length>50?' (أول ٥٠)':'');
R.innerHTML=f.slice(0,50).map(x=>`<div class="r" data-s="${x.s}" data-a="${x.a}"><small>${NAMES[x.s-1]} · ${ar(x.a)}</small><div style="font-family:'Amiri Quran',serif">${esc(x.t)}</div></div>`).join('');
R.querySelectorAll('.r').forEach(e=>e.onclick=()=>open(+e.dataset.s,+e.dataset.a))}}
function bm(m){if(!BM.length){m.innerHTML='<p class="mu">لا توجد علامات بعد. اضغط مرتين على أي آية داخل السورة لإضافتها.</p>';return}
m.innerHTML=BM.map(k=>{const[s,a]=k.split(':').map(Number);const x=(BY[s]||[])[a-1];return `<div class="r" data-s="${s}" data-a="${a}"><small>${NAMES[s-1]} · ${ar(a)}</small><div style="font-family:'Amiri Quran',serif">${x?esc(x.t):''}</div></div>`}).join('');
m.querySelectorAll('.r').forEach(e=>e.onclick=()=>open(+e.dataset.s,+e.dataset.a))}
function wird(m){const p=Math.min(W.count,W.goal);
m.innerHTML=`<div class="box"><h3 style="margin-top:0">وردك اليوم</h3><progress value="${p}" max="${W.goal}"></progress>
<p>${ar(W.count)} من ${ar(W.goal)} آية ${W.count>=W.goal?'— أحسنت، أتممت وردك 🌿':''}</p>
<label class="mu">الهدف اليومي (عدد الآيات)</label><input type="number" id="g" min="1" value="${W.goal}">
<p><button class="btn" id="add">+ ١٠ آيات</button> <button class="btn" id="rs">تصفير اليوم</button></p></div>`;
document.getElementById('g').onchange=e=>{W.goal=Math.max(1,+e.target.value||20);saveW();wird(m)};
document.getElementById('add').onclick=()=>{W.count+=10;saveW();wird(m)};
document.getElementById('rs').onclick=()=>{W.count=0;saveW();wird(m)}}
function set(m){m.innerHTML=`<div class="box"><h3 style="margin-top:0">المظهر</h3>
<button class="btn" data-th="light">فاتح</button> <button class="btn" data-th="dark">داكن</button></div>`+importBox(false)+
`<p class="mu">النص مأخوذ من Tanzil.net دون أي تعديل. يُنصح بمراجعة التطبيق من جهة مختصة قبل نشره للعامة.</p>`;
m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=b.dataset.th);bindImport()}
const saved=ls.get('q_raw');if(saved)load(saved);render();
</script>
</body>
</html>
